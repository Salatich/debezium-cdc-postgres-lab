[project]
name = "debezium-cdc-postgres-lab"
version = "0.1.0"
description = "Production-grade PostgreSQL Change Data Capture (CDC) with Debezium, Kafka, and Confluent Schema Registry"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "confluent-kafka>=2.6.0",
    "faker>=33.0.0",
    "fastavro>=1.9.0",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
